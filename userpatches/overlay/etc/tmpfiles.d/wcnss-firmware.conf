# Snapmaker J1: point the prima WLAN firmware at this unit's factory NV data.
# /persist holds per-device WCNSS calibration; symlink the two fixed-name files
# there so the prima driver loads the unit-specific values instead of generic ones.
# L+ removes any file shipped in the overlay first, then (re)creates the symlink.
L+ /usr/lib/firmware/wlan/prima/WCNSS_qcom_wlan_nv.bin    - - - - /persist/WCNSS_qcom_wlan_nv.bin
L+ /usr/lib/firmware/wlan/prima/WCNSS_wlan_dictionary.dat - - - - /persist/WCNSS_wlan_dictionary.dat
