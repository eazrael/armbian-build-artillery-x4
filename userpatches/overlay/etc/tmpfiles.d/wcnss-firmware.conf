# Snapmaker J1: per-device prima WLAN firmware comes from /persist (this unit's WiFi MAC +
# RF calibration), not from baked blobs. L+ recreates the symlinks every boot, so an OS
# update writing into wlan/prima/ can never strand the calibration. See also
# /etc/modprobe.d/wcnss-defer.conf and wcnss-firmware.service.
L+ /usr/lib/firmware/wlan/prima/WCNSS_qcom_wlan_nv.bin    - - - - /persist/WCNSS_qcom_wlan_nv.bin
L+ /usr/lib/firmware/wlan/prima/WCNSS_wlan_dictionary.dat - - - - /persist/WCNSS_wlan_dictionary.dat
