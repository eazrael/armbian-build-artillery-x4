# Snapmaker J1: do NOT let udev cold-plug autoload the WCNSS remoteproc module. It has
# auto_boot=true and would fire a one-shot request_firmware("wcnss.mdt") at probe (~14s),
# before the modem/persist partitions are mounted -- it fails -ENOENT and never retries.
# wcnss-firmware.service modprobes it (with --ignore-install) once the mounts are up.
install qcom_wcnss_pil /bin/true
